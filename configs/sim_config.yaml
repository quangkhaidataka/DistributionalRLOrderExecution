# =============================================================================
# sim_config.yaml  —  REFERENCE ONLY, NOT LOADED BY ANY CODE (see PLAN.md D4)
# =============================================================================
# The run scripts do NOT read this file. The authoritative source of truth is:
#   - EnvConfig / SimConfig dataclasses in envs/base_env.py & envs/simulated_env.py
#   - the hardcoded DEFAULT_SIM_CONFIG dict in experiments/run_simulation.py
# Every value below is kept in sync with those dataclass defaults so this file
# is honest documentation, but editing it changes nothing at runtime.
#
# Known runtime overrides applied by run_simulation.py's DEFAULT_SIM_CONFIG:
#   - ou_theta = 0.15  (SimConfig dataclass default is 0.4)
#   - jump_intensity/mean/std as in the "jump_diffusion" section below
# =============================================================================


# ---------------------------------------------------------------------------
# Shared environment parameters (EnvConfig / SimConfig)
# ---------------------------------------------------------------------------
environment:

  # Execution horizon
  N: 5                      # number of decision periods
  T: 60.0                   # total horizon in minutes
                            # dt = T / N = 12 minutes per period

  # Inventory
  q0: 100000                # initial shares to liquidate
  p0: 100.0                 # arrival (benchmark) price in dollars

  # Market impact model
  #   Temporary impact:  p_exec = p_t - eta * (x_t / dt)
  #   Permanent impact:  p_{t+1} = p_t - gamma * x_t + noise
  eta: 2.5e-6               # temporary impact coefficient
  gamma: 2.5e-7             # permanent impact coefficient
  a: 0.001                  # quadratic trade-penalty coefficient
  penalty_type: quadratic   # 'quadratic' or 'linear'

  # Volatility (per-period, in DOLLARS: the diffusion term is sigma*sqrt(dt)
  # added to a ~$100 price, i.e. an absolute-dollar increment, not a return).
  sigma: 0.00095

  # MDP
  discount: 0.99            # gamma in the Bellman equation


# ---------------------------------------------------------------------------
# Jump-diffusion parameters (JumpDiffusionEnv) — STRESS SCENARIO
# P1-T3/D3: intensity is PER PERIOD (Poisson rate used directly, no *dt).
#   E[jumps/episode] = jump_intensity * N = 0.15,  P(>=1 jump/episode) ~ 14%.
#   Each jump ~ N(mu_J, sigma_J^2) in dollars; mu_J = -0.30 ~ -30 bps on p0=100.
# ---------------------------------------------------------------------------
jump_diffusion:
  jump_intensity: 0.03      # lambda_J: expected jumps per period
  jump_mean: -0.30          # mu_J: mean jump size in dollars (adverse)
  jump_std: 0.40            # sigma_J: jump size volatility in dollars


# ---------------------------------------------------------------------------
# Mean-reverting parameters (MeanRevertingEnv, OU price)
# ---------------------------------------------------------------------------
mean_reverting:
  ou_theta: 0.4             # mean-reversion speed (SimConfig default; run
                            # scripts override to 0.15 via DEFAULT_SIM_CONFIG)
  ou_mu: 100.0              # long-term mean price (= p0)


# ---------------------------------------------------------------------------
# Regime-switching parameters (RegimeSwitchingEnv)
# NOTE: RegimeSwitchingEnv still exists and is exercised by tests/run_tests.py,
# but experiments/run_simulation.py runs {ac, mean_reverting, jump_diffusion}
# only — it does NOT run the regime-switching env.
# ---------------------------------------------------------------------------
regime_switching:
  sigma_low: 0.0005         # normal-regime volatility per period
  sigma_high: 0.008         # stress-regime volatility per period
  p_01: 0.15                # P(normal -> stress) per period
  p_10: 0.40                # P(stress -> normal) per period
  spread_base: 0.02         # base spread as a fraction of price
  spread_noise: 0.3         # multiplicative spread noise level
  imb_mean_rev: 0.5         # imbalance OU mean-reversion speed
