# =============================================================================
# agent_config.yaml  —  REFERENCE ONLY, NOT LOADED BY ANY CODE (see PLAN.md D4)
# =============================================================================
# The run scripts do NOT read this file. The authoritative source of truth is:
#   - AgentConfig   in agents/iqn_agents.py   (IQN)
#   - DeepRLConfig  in agents/baselines.py    (DQN / DDQN / QR-DQN)
#   - DEFAULT_TRAIN in experiments/run_simulation.py  (sim training loop)
#   - the module constants in experiments/run_tag.py  (TAQ training loop)
# Every value below mirrors those dataclass defaults / constants so this file
# is honest documentation; editing it changes nothing at runtime.
# =============================================================================


# ---------------------------------------------------------------------------
# 1. IQN agent (AgentConfig in agents/iqn_agents.py)
# ---------------------------------------------------------------------------
iqn:
  # Risk profile — same trained weights, different inference-time tau range:
  #   cvar_alpha = 1.0  -> IQN-neutral   (tau ~ U[0,1])
  #   cvar_alpha = 0.95 -> IQN-CVaR_0.95 (tau ~ U[0,0.95])
  #   cvar_alpha = 0.90 -> IQN-CVaR_0.90 (tau ~ U[0,0.90])
  cvar_alphas: [1.0, 0.95, 0.90]

  # Quantile sampling (Dabney et al. 2018)
  n_tau_samples: 8          # N   tau samples for the online-network loss
  n_tau_targets: 8          # N'  tau samples for the TD target
  n_tau_policy: 32          # K   tau samples for greedy action selection
  huber_kappa: 1.0          # kappa in the quantile Huber loss

  # Network (unified architecture, D1)
  hidden_dim: 64            # embedding dimension d
  cos_embedding_dim: 32     # n in the cosine quantile embedding
  n_hidden_layers: 2        # 2-layer LayerNorm+ReLU state encoder
  # -> 11,462 trainable parameters (state_dim=5, n_actions=6)


# ---------------------------------------------------------------------------
# 2. Baseline agents (DeepRLConfig in agents/baselines.py)
# ---------------------------------------------------------------------------
baselines:
  qr_dqn_n_quantiles: 51    # QR-DQN fixed quantile midpoints (odd -> includes median)
  ac_risk_aversion: 1.0e-6  # Almgren-Chriss analytical baseline risk aversion
  # DQN/DDQN network (unified, D1): hidden_dim=64, n_hidden_layers=2
  # -> 5,190 trainable parameters (state_dim=5, n_actions=6)


# ---------------------------------------------------------------------------
# 3. Shared hyperparameters (identical in AgentConfig and DeepRLConfig)
# ---------------------------------------------------------------------------
shared:
  lr: 1.0e-4                # Adam learning rate
  gamma: 0.99               # discount factor (matches env discount)
  batch_size: 64            # minibatch size
  grad_clip_norm: 10.0      # max gradient norm

  target_update_freq: 500   # hard target-network update every N gradient steps

  epsilon_start: 1.0        # initial epsilon
  epsilon_end: 0.01         # final epsilon
  epsilon_decay_steps: 50000  # linear decay over this many gradient steps

  replay_capacity: 50000    # replay buffer capacity (transitions)
  replay_min_size: 256      # min transitions before the first gradient step

  hidden_dim: 64            # unified network width (D1)
  n_hidden_layers: 2


# ---------------------------------------------------------------------------
# 4. Training loop
# ---------------------------------------------------------------------------
training:
  # Simulation (experiments/run_simulation.py -> DEFAULT_TRAIN)
  sim:
    n_episodes: 30000       # total training episodes per learned agent
    eval_freq: 1000         # evaluate + checkpoint every N episodes
    checkpoint_freq: 1000
    n_eval_episodes: 10000  # episodes for the final evaluation
    seed: 42

  # TAQ empirical study (experiments/run_tag.py module constants)
  taq:
    n_episodes: 50000       # training episodes per agent per fold
    eval_freq: 1000
    checkpoint_freq: 1000
    n_val_eval: 300         # validation episodes (model selection on val CVaR_0.95)
    n_test_eval: 10000      # test episodes
    seed: 42

  monitor_metric: CVaR_0.95_bps   # checkpoint selection criterion (min)
